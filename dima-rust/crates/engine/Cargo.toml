[package]
name = "dima-engine"
description = "The command language: syntax, block model, evaluator, function registry and the host trait every effect goes through."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dima-text = { workspace = true }
# Clock and randomness traits the host exposes.
dima-core = { workspace = true }
# The permission system's role rules (`roles.ts`): the identity a command reference runs with.
dima-commands = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Block names and the user/title functions are checked with `\p{L}`, `\p{M}`, `\p{N}`, as the
# reference's `/u` regular expressions do.
regex = { workspace = true }


[dev-dependencies]
# The real-data test (tests/real_commands.rs) reads the local `domdimabot` copy, read-only.
anyhow = { workspace = true }
bson = { workspace = true }
futures-util = { workspace = true }
mongodb = { workspace = true }
tokio = { workspace = true }
