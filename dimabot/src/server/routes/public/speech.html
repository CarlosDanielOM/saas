<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Overlay</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script>
        const channelID = window.location.pathname.split('/')[2];
        const socket = io(`/speech/${channelID}`, {
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });

        // Keep deliveries ordered even after a reconnect or a server recovery timeout.
        const queue = [];
        const seen = new Set();
        let current = null;
        let synchronized = false;

        function report(item, phase) {
            socket.emit('speech-playback', {
                speechID: item.speechID, phase,
                position: item.audio?.currentTime || 0
            });
        }

        function finish(item, reason, notify = true) {
            if (current !== item || item.finished) return;
            item.finished = true;
            clearInterval(item.watchdog);
            item.controller?.abort();
            const position = item.audio?.currentTime || 0;
            if (item.audio) {
                item.audio.pause();
                item.audio.removeAttribute('src');
                item.audio.load(); // Cancel pending play promises and network/media work.
                item.audio.remove();
            }
            if (item.blobUrl) URL.revokeObjectURL(item.blobUrl);
            if (notify) socket.emit('speech-ended', { speechID: item.speechID, reason, position });
            current = null;
            void playNext();
        }

        async function download(item) {
            for (let attempt = 0; attempt < 2; attempt++) {
                item.controller = new AbortController();
                const timeout = setTimeout(() => item.controller.abort(), 20000);
                try {
                    const response = await fetch(item.audioUrl, { signal: item.controller.signal });
                    if (!response.ok) throw new Error(`Audio HTTP ${response.status}`);
                    const blob = await response.blob();
                    if (!blob.size) throw new Error('Empty audio');
                    return blob;
                } catch (error) {
                    if (attempt === 1 || item.finished) throw error;
                } finally {
                    clearTimeout(timeout);
                }
            }
        }

        async function playNext() {
            if (current || !queue.length) return;
            const item = current = queue.shift();
            report(item, 'loading');
            try {
                // Start only once all bytes are local: network buffering cannot
                // stop a sentence halfway through or consume its playback budget.
                const blob = await download(item);
                if (item.finished) return;
                item.blobUrl = URL.createObjectURL(blob);
                const audio = item.audio = document.createElement('audio');
                audio.src = item.blobUrl;
                audio.dataset.speechId = item.speechID;
                audio.addEventListener('ended', () => finish(item, 'ended'));
                audio.addEventListener('error', () => finish(item, 'media-error'));
                audio.addEventListener('playing', () => report(item, 'playing'));
                document.body.appendChild(audio);
                let lastPosition = 0;
                let lastProgressAt = Date.now();
                let recovered = false;
                item.watchdog = setInterval(() => {
                    if (current !== item || item.finished) return;
                    if (audio.currentTime > lastPosition + 0.05) {
                        lastPosition = audio.currentTime;
                        lastProgressAt = Date.now();
                        report(item, 'progress');
                    } else if (Date.now() - lastProgressAt >= 15000) {
                        if (recovered) return finish(item, 'stalled');
                        // One local decoder restart, resuming at the same position.
                        // No new HTTP download and no replay of the whole sentence.
                        recovered = true;
                        lastProgressAt = Date.now();
                        report(item, 'recovering');
                        audio.load();
                        audio.currentTime = lastPosition;
                        audio.play().catch(() => finish(item, 'play-error'));
                    }
                }, 2000);
                await audio.play();
            } catch {
                finish(item, item.audio ? 'play-error' : 'download-error');
            }
        }

        function resetPlayback() {
            synchronized = false;
            queue.length = 0;
            if (current) finish(current, 'disconnected', false);
        }

        socket.on('disconnect', resetPlayback);
        socket.on('connect', resetPlayback);
        socket.on('speech-reset', () => {
            resetPlayback();
            synchronized = true;
        });

        socket.on('speech', (payload) => {
            // Ignore packets recovered from the old connection until the server
            // has reset this session. Interrupted speech is never replayed.
            if (!synchronized) return;
            if (!payload?.audioUrl || !payload.speechID || seen.has(payload.speechID)) return;
            seen.add(payload.speechID);
            // Bound duplicate history for overlays that stay open for weeks.
            if (seen.size > 1000) seen.delete(seen.values().next().value);
            queue.push({ speechID: payload.speechID, audioUrl: payload.audioUrl });
            void playNext();
        });
    </script>
</body>
</html>
