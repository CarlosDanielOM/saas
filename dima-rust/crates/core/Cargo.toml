[package]
name = "dima-core"
description = "Configuration parsing, errors, clock and randomness, shutdown, crypto."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Predictable randomness for tests: `SeededRandom` and `CredentialCipher::encrypt_with_iv`.
# Off by default; enable it only from `[dev-dependencies]`, never in a binary's dependencies.
test-util = []

[dependencies]
dima-text = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
regex-automata = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
# Paused time for the deadline and supervisor tests.
tokio = { workspace = true, features = ["test-util"] }
