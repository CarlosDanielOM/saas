server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep apex discovery on the documentation site's generated source of truth.
    location = /llms.txt {
        return 301 https://docs.domdimabot.com/llms.txt;
    }

    location = /llms-full.txt {
        return 301 https://docs.domdimabot.com/llms-full.txt;
    }

    location = /docs {
        return 301 https://docs.domdimabot.com/;
    }

    location = /docs/ {
        return 301 https://docs.domdimabot.com/;
    }

    location = /documentation {
        return 301 https://docs.domdimabot.com/;
    }

    location = /documentation/ {
        return 301 https://docs.domdimabot.com/;
    }

    # Error routes: serve the app shell with the real status code (and keep them out of
    # search results). Unknown app URLs are redirected to /404 by the Angular router.
    location = /401 { error_page 401 @error_shell; return 401; }
    location = /403 { error_page 403 @error_shell; return 403; }
    location = /404 { error_page 404 @error_shell; return 404; }
    location = /500 { error_page 500 @error_shell; return 500; }
    location = /503 { error_page 503 @error_shell; return 503; }

    location @error_shell {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.csr.html =404;
    }

    # Hybrid rendering:
    # - '/' resolves to the prerendered index.html via $uri/index.html
    # - static assets resolve via $uri
    # - everything else (CSR app routes) falls back to index.csr.html —
    #   never to the prerendered index.html, or hydration would mismatch
    location / {
        try_files $uri $uri/index.html /index.csr.html;
    }

    location ~* \.(?:css|js|mjs|ico|gif|jpe?g|png|svg|webp|woff2?|ttf|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /index.csr.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
