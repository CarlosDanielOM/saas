[package]
name = "dima-commands"
description = "Who may run a chat command and when: permissions and roles, keywords, moderation patterns, cooldowns, timer policy; and the runtime that finds commands and keeps their caches."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dima-text = { workspace = true, features = ["collation"] }
dima-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Stored permission expressions are untyped `Mixed` values read as raw BSON (`dima-model`).
bson = { workspace = true }
regex = { workspace = true }
# The complement of a Unicode property as explicit ranges, as the `re2` package writes it.
regex-syntax = { workspace = true }
# The combined variation rule is compiled in chunks whose heap use is counted (`memory_usage`),
# on the same engine `regex` uses, with its performance features.
regex-automata = { workspace = true, features = ["hybrid", "nfa-backtrack", "dfa-onepass", "perf-literal"] }
# The keyword index cache coalesces cold loads (`sync`) and resolves roles concurrently (`macros`).
tokio = { workspace = true }
thiserror = { workspace = true }
# `runtime`: the command lookup and its Dragonfly cache, the availability service, chat history
# and the role cache loader run against the stores (all layers below this crate, no cycle).
dima-store = { workspace = true }
dima-model = { workspace = true }
# `runtime::availability`: the Helix reward toggle goes through the Twitch crate's wrapper.
dima-twitch = { workspace = true }
dima-http = { workspace = true }
mongodb = { workspace = true }
redis = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
dima-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
dima-http = { workspace = true, features = ["test-util"] }
dima-twitch = { workspace = true, features = ["test-util"] }
url = { workspace = true }
anyhow = { workspace = true }
