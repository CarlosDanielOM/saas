[package]
name = "dima-billing"
description = "Plans and entitlements, credit packs, free-credit resets, credit sources, AI usage events and the Polar client."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dima-core = { workspace = true }
# `localeCompare` for the entitlement fingerprint.
dima-text = { workspace = true, features = ["collation"] }
dima-http = { workspace = true }
dima-store = { workspace = true }
dima-model = { workspace = true }
bson = { workspace = true }
mongodb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
redis = { workspace = true }
# WHATWG URL parsing of checkout redirect URLs (`new URL`).
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dima-core = { workspace = true, features = ["test-util"] }
dima-http = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
