server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security headers - allow Twitch iframe embedding via CSP. Repeated in each location because
    # nginx drops server-level add_header lines in any location that sets its own.
    add_header Content-Security-Policy "frame-ancestors https://supervisor.ext-twitch.tv https://extension-files.twitch.tv https://*.twitch.tv https://*.twitch.tech https://localhost.twitch.tv:* https://localhost.twitch.tech:* http://localhost.rig.twitch.tv:*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Extension API gateway
    location /api/ {
        proxy_pass http://dimafx-server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The whole dimafx/ checkout is mounted here (server source, compose file, guides), so only the
    # extension's own client files are served. Everything else is a 404.
    location = /panel.html { try_files $uri =404; }
    location = /mobile.html { try_files $uri =404; }
    location = /config.html { try_files $uri =404; }
    location ~ ^/(panel|config)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /storefront.css {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/assets/[A-Za-z0-9._-]+\.(png|svg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        return 404;
    }
}
