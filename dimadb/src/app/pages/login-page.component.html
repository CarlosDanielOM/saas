<section class="wrap">
  <div class="brand">
    <span class="mark">db</span>
    <strong>dimadb</strong>
  </div>
  <span class="chip">Mock</span>
  <div>
    <h1>Sign in</h1>
    <p>Local users only. Nothing is saved yet.</p>
  </div>
  <form (submit)="$event.preventDefault()">
    <label>
      Username
      <input name="username" autocomplete="username" value="dom" />
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="current-password" value="••••••••" />
    </label>
    <button class="btn" type="submit" routerLink="/browse">Continue</button>
  </form>
  <p class="alt">First boot? <a routerLink="/setup">Create the admin</a></p>
</section>
