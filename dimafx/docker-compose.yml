services:
  dimafx:
    image: nginx:alpine
    container_name: dimafx
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - web-proxy
      - dimafx-internal

  dimafx-server:
    build:
      context: ./server
    container_name: dimafx-server
    restart: unless-stopped
    environment:
      PORT: 8080
      DIMABOT_INTERNAL_API_URL: ${DIMABOT_INTERNAL_API_URL:-http://dima-server:3000}
      DIMABOT_PUBLIC_API_URL: ${DIMABOT_PUBLIC_API_URL:-https://api.domdimabot.com}
      DIMAFX_SERVICE_TOKEN: ${DIMAFX_SERVICE_TOKEN}
      TWITCH_EXTENSION_SECRET: ${TWITCH_EXTENSION_SECRET}
      DIMAFX_ALLOW_UNVERIFIED_TWITCH_JWT: ${DIMAFX_ALLOW_UNVERIFIED_TWITCH_JWT:-false}
    expose:
      - "8080"
    networks:
      - dimafx-internal
      - web-proxy

networks:
  web-proxy:
    external: true
  dimafx-internal:
    driver: bridge
