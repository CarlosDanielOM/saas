<div class="lf" [attr.data-code]="statusCode()">
  <header class="lf-nav">
    <a class="lf-brand" routerLink="/">
      <span class="lf-brand__live" aria-hidden="true"></span>
      DomDimaBot
    </a>
    <div class="lf-nav__actions">
      <button
        type="button"
        class="lf-btn lf-btn--ghost lf-btn--tool"
        (click)="toggleLanguage()"
        [attr.aria-label]="t('commands.public.languageToggle')"
      >
        {{ languageLabel() }}
      </button>
      <button
        type="button"
        class="lf-btn lf-btn--ghost lf-btn--tool lf-btn--theme"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode() ? t('landing.theme.darkActive') : t('landing.theme.lightActive')"
      >
        <lucide-icon [name]="isDarkMode() ? moonIcon : sunIcon" [size]="16" aria-hidden="true" />
        <span>{{ isDarkMode() ? t('landing.theme.dark') : t('landing.theme.light') }}</span>
      </button>
      <a class="lf-btn lf-btn--primary" routerLink="/login">{{ tk('actions.login') }}</a>
    </div>
  </header>

  <main class="lf-main">
    <section class="lf-bento" aria-labelledby="status-title">
      <article class="lf-tile lf-tile--hero">
        <p class="lf-kicker">{{ tk('eyebrow') }}</p>
        <p class="lf-code lf-code--danger" aria-hidden="true">{{ statusCode() }}</p>
        <h1 id="status-title" class="lf-title">{{ tk('title') }}</h1>
        <p class="lf-copy">{{ tk('message') }}</p>

        <div class="lf-actions">
          <button type="button" class="lf-btn lf-btn--primary" (click)="reload()">
            {{ tk('actions.retry') }}
          </button>
          <a class="lf-btn" routerLink="/">{{ tk('actions.home') }}</a>
        </div>
      </article>

      <aside class="lf-tile lf-tile--side">
        <p class="lf-side__kicker">{{ tk('tipsTitle') }}</p>
        <ul class="lf-side__list">
          <li>{{ tk('tips.0') }}</li>
          <li>{{ tk('tips.1') }}</li>
          <li>{{ tk('tips.2') }}</li>
        </ul>
      </aside>
    </section>
  </main>
</div>
