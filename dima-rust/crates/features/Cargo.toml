[package]
name = "dima-features"
description = "The channel features as libraries, without sockets: goals, roulettes, duels, bits rules, widgets, Overlay Studio, pets, assets, follow defense, custom timers."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dima-engine = { workspace = true }
dima-twitch = { workspace = true }
dima-events = { workspace = true }
dima-stream = { workspace = true }
dima-tts = { workspace = true }
dima-billing = { workspace = true }
dima-platform = { workspace = true }
dima-model = { workspace = true }
dima-store = { workspace = true }
# P4-FEAT-GAMES (roulette, duel, bits rules).
dima-core = { workspace = true }
dima-text = { workspace = true, features = ["collation"] }
dima-http = { workspace = true }
bson = { workspace = true }
mongodb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
# Direct command used only to disconnect this test's own pubsub socket.
redis = { workspace = true }
anyhow = { workspace = true }
dima-core = { workspace = true, features = ["test-util"] }
dima-http = { workspace = true, features = ["test-util"] }
# Race and kill tests run a second copy of the test binary as a child process.
tokio = { workspace = true, features = ["process", "io-util"] }
