[package]
name = "dima-actions"
description = "The engine's host (DimaHost), chat delivery, command execution, AST timers, simulation, AI chat and its tools, the AST catalog."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The crate map's dependencies (ledger/upper-layers.md section 2.3).
dima-engine = { workspace = true }
dima-commands = { workspace = true }
dima-moderation = { workspace = true }
dima-features = { workspace = true }
dima-ai = { workspace = true }
dima-tts = { workspace = true }
dima-twitch = { workspace = true }
dima-billing = { workspace = true }
dima-stream = { workspace = true }
dima-events = { workspace = true }
# Foundation crates the host's handles come from.
dima-core = { workspace = true }
dima-store = { workspace = true }
# P4-ACT-CORE: the `astvariables` and `commands` write helpers, and the driver's types.
dima-model = { workspace = true }
bson = { workspace = true }
mongodb = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# P4-BOT-INGRESS: the bot runtime metrics, the pub/sub manager and the product events.
dima-http = { workspace = true }
dima-telemetry = { workspace = true }
dima-text = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
dima-twitch = { workspace = true, features = ["test-util"] }
futures-util = { workspace = true }
bson = { workspace = true }
dima-model = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
dima-core = { workspace = true, features = ["test-util"] }
dima-billing = { workspace = true }
flate2 = { workspace = true }
anyhow = { workspace = true }
dima-http = { workspace = true, features = ["test-util"] }
redis = { workspace = true }

