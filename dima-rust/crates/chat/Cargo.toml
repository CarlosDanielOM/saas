version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dima-actions = { workspace = true }
# P4-BOT-INGRESS: the webhook (journal, raid filter, Dragonfly claims, the HTTP edge).
dima-core = { workspace = true }
