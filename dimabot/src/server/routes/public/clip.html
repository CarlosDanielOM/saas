<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
        }
        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
        }
        .overlay { transform-origin: top left !important; }
        .tester {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 100px;
            height: 100px;
            background-color: #000;
            color: #fff;
            border-radius: 5px;
            padding: 10px;
            z-index: 9999;
        }

        /* Legacy design 2 */
        .overlay[data-variant='2'] .skin { position: relative; height: 100%; }
        .overlay[data-variant='2'] .skin__video {
            width: 400px; height: 225px; overflow: hidden;
        }
        .overlay[data-variant='2'] .skin video {
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .overlay[data-variant='2'] .skin__avatar,
        .overlay[data-variant='2'] .skin__meta { display: none; }
        .overlay[data-variant='2'].is-in .skin video { opacity: 1; }

        /* Legacy design 3 */
        .overlay[data-variant='3'] .skin { position: relative; height: 100%; }
        .overlay[data-variant='3'] .skin__video { position: absolute; inset: 0; }
        .overlay[data-variant='3'] .skin video {
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .overlay[data-variant='3'] .skin__avatar {
            width: 60px; height: 60px; border-radius: 50%;
            position: absolute; top: 10px; right: 10px; overflow: hidden; z-index: 5;
            transform: scale(0); opacity: 0;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
        }
        .overlay[data-variant='3'] .skin__avatar img { width: 100%; height: 100%; object-fit: cover; }
        .overlay[data-variant='3'] .skin__meta {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); color: #fff; text-align: center;
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .overlay[data-variant='3'] .skin__name { font-size: 1.8em; font-weight: 300; margin-bottom: 10px; }
        .overlay[data-variant='3'] .skin__copy { font-size: .8em; font-weight: 300; margin-bottom: 10px; }
        .overlay[data-variant='3'] .skin__kicker { font-size: 1em; font-weight: 300; }
        .overlay[data-variant='3'] .skin__title { display: none; }
        .overlay[data-variant='3'].is-in .skin video,
        .overlay[data-variant='3'].is-in .skin__avatar,
        .overlay[data-variant='3'].is-in .skin__meta { opacity: 1; }
        .overlay[data-variant='3'].is-in .skin__avatar { transform: scale(1); }

.overlay {
  width: 800px;
  height: 225px;
  transform-origin: center center;
  position: relative;
}

.overlay.is-idle {
  visibility: hidden;
  pointer-events: none;
}

.skin,
.skin__video,
.skin__avatar,
.skin__meta,
.skin video {
  background: transparent;
}

.skin video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.skin__kicker,
.skin__name,
.skin__copy,
.skin__title {
  margin: 0;
}

/* ——— Classic (prod Design 1) ——— */
.overlay[data-variant='classic'] .skin {
  width: 800px;
  height: 225px;
  position: relative;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

.overlay[data-variant='classic'] .skin__video {
  width: 400px;
  height: 100%;
  position: absolute;
  inset: 0 auto auto 0;
  overflow: hidden;
  border-radius: 15px 0 0 15px;
}

.overlay[data-variant='classic'] .skin video {
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

.overlay[data-variant='classic'] .skin__avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  position: absolute;
  top: 62px;
  left: 350px;
  overflow: hidden;
  z-index: 5;
  transform: scale(0);
  opacity: 0;
  transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
}

.overlay[data-variant='classic'] .skin__avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay[data-variant='classic'] .skin__meta {
  width: 400px;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border-radius: 0 15px 15px 0;
  padding: 5px 5px 5px 55px;
  box-sizing: border-box;
  opacity: 0;
  transform: translateX(0);
  transition: transform 1s ease-in-out, opacity 1.5s ease-in-out;
}

.overlay[data-variant='classic'] .skin__kicker,
.overlay[data-variant='classic'] .skin__title {
  display: none;
}

.overlay[data-variant='classic'] .skin__name,
.overlay[data-variant='classic'] .skin__copy {
  color: #fff;
  font-weight: 300;
  margin-bottom: 10px;
}

.overlay[data-variant='classic'] .skin__name {
  font-size: 1.8em;
}

.overlay[data-variant='classic'] .skin__copy {
  font-size: 0.8em;
  order: 2;
}

.overlay[data-variant='classic'] .skin__meta::after {
  content: none;
}

.overlay[data-variant='classic'] .skin__copy + .skin__title {
  display: none;
}

.overlay[data-variant='classic'] .skin__name {
  order: 1;
}

.overlay[data-variant='classic'].is-in .skin video,
.overlay[data-variant='classic'].is-in .skin__avatar,
.overlay[data-variant='classic'].is-in .skin__meta {
  opacity: 1;
}

.overlay[data-variant='classic'].is-in .skin__avatar {
  transform: scale(1);
}

.overlay[data-variant='classic'].is-in .skin__meta {
  transform: translateX(400px);
}

.overlay[data-variant='classic'] .skin__kicker {
  display: block;
  color: #fff;
  font-weight: 300;
  font-size: 1em;
  order: 3;
  margin-bottom: 10px;
}

/* ——— Tile ——— */
.overlay[data-variant='tile'] .skin {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  grid-template-areas: 'video meta';
  gap: 0.7rem;
  padding: 0.7rem;
  height: 100%;
  box-sizing: border-box;
  font-family: var(--font);
}

.overlay[data-variant='tile'] .skin__video {
  grid-area: video;
  border-radius: 1rem;
  overflow: hidden;
}

.overlay[data-variant='tile'] .skin video,
.overlay[data-variant='tile'] .skin__meta {
  opacity: 0;
  transition: opacity 1.1s ease-in-out, transform 1.1s ease-in-out;
}

.overlay[data-variant='tile'] .skin video {
  transform: translateY(8px);
}

.overlay[data-variant='tile'] .skin__avatar {
  display: none;
}

.overlay[data-variant='tile'] .skin__meta {
  grid-area: meta;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.85rem 0.95rem 0.85rem 1.05rem;
  border-radius: 1rem;
  background: rgba(15, 17, 21, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: inset 4px 0 0 var(--clip-accent, #8b5cf6);
  color: #f5f7fb;
  transform: translateX(16px);
}

.overlay[data-variant='tile'] .skin__kicker {
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--clip-accent, #c4b5fd);
}

.overlay[data-variant='tile'] .skin__name {
  font-size: 1.15rem;
  letter-spacing: -0.03em;
}

.overlay[data-variant='tile'] .skin__copy {
  color: #c5cce0;
  font-size: 0.86rem;
  line-height: 1.35;
}

.overlay[data-variant='tile'] .skin__title {
  color: rgba(255, 255, 255, 0.5);
  font-size: 0.74rem;
  font-weight: 650;
}

.overlay[data-variant='tile'].is-in .skin video,
.overlay[data-variant='tile'].is-in .skin__meta {
  opacity: 1;
  transform: none;
}

.overlay[data-variant='tile'].is-in .skin__meta {
  transition-delay: 0.14s;
}

/* ——— Third ——— */
.overlay[data-variant='third'] .skin {
  position: relative;
  height: 100%;
  font-family: var(--font);
}

.overlay[data-variant='third'] .skin__video {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 0.85rem;
}

.overlay[data-variant='third'] .skin video {
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.overlay[data-variant='third'] .skin__avatar {
  position: absolute;
  left: 16px;
  bottom: 18px;
  width: 52px;
  height: 52px;
  border-radius: 999px;
  overflow: hidden;
  z-index: 3;
  border: 2px solid #fff;
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 1.1s ease-in-out, transform 1.1s ease-in-out;
}

.overlay[data-variant='third'] .skin__avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay[data-variant='third'] .skin__meta {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: 76px 1fr;
  align-items: center;
  min-height: 72px;
  padding: 0.65rem 1rem 0.65rem 0.85rem;
  background: linear-gradient(90deg, rgba(10, 10, 14, 0.92), rgba(10, 10, 14, 0.78));
  border-top: 3px solid var(--clip-accent, #8b5cf6);
  color: #fff;
  opacity: 0;
  transform: translateY(100%);
  transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
}

.overlay[data-variant='third'] .skin__kicker {
  grid-column: 2;
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--clip-accent, #c4b5fd);
}

.overlay[data-variant='third'] .skin__name {
  grid-column: 2;
  font-size: 1.2rem;
  letter-spacing: -0.03em;
}

.overlay[data-variant='third'] .skin__copy {
  grid-column: 2;
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.82rem;
}

.overlay[data-variant='third'] .skin__title {
  display: none;
}

.overlay[data-variant='third'].is-in .skin video,
.overlay[data-variant='third'].is-in .skin__avatar,
.overlay[data-variant='third'].is-in .skin__meta {
  opacity: 1;
  transform: none;
}

.overlay[data-variant='third'].is-in .skin__avatar,
.overlay[data-variant='third'].is-in .skin__meta {
  transition-delay: 0.12s;
}

/* ——— Cinema ——— */
.overlay[data-variant='cinema'] .skin {
  position: relative;
  height: 100%;
  overflow: hidden;
  border-radius: 0.9rem;
  font-family: var(--font);
}

.overlay[data-variant='cinema'] .skin__video {
  position: absolute;
  inset: 0;
}

.overlay[data-variant='cinema'] .skin video {
  opacity: 0;
  transition: opacity 1.15s ease-in-out;
}

.overlay[data-variant='cinema'] .skin__avatar {
  position: absolute;
  left: 14px;
  bottom: 16px;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  overflow: hidden;
  z-index: 2;
  opacity: 0;
  transform: scale(0.82);
  transition: opacity 1s ease-in-out, transform 1s ease-in-out;
}

.overlay[data-variant='cinema'] .skin__avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay[data-variant='cinema'] .skin__meta {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.35rem 0.7rem;
  padding: 2.4rem 1rem 0.85rem 68px;
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.78));
  color: #fff;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 1.1s ease-in-out, transform 1.1s ease-in-out;
}

.overlay[data-variant='cinema'] .skin__kicker {
  width: 100%;
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #fff;
}

.overlay[data-variant='cinema'] .skin__name {
  font-size: 1.05rem;
}

.overlay[data-variant='cinema'] .skin__copy {
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.82rem;
}

.overlay[data-variant='cinema'] .skin__title {
  display: none;
}

.overlay[data-variant='cinema'].is-in .skin video,
.overlay[data-variant='cinema'].is-in .skin__avatar,
.overlay[data-variant='cinema'].is-in .skin__meta {
  opacity: 1;
  transform: none;
}

.overlay[data-variant='cinema'].is-in .skin__meta,
.overlay[data-variant='cinema'].is-in .skin__avatar {
  transition-delay: 0.16s;
}

/* ——— Orbit ——— */
.overlay[data-variant='orbit'] .skin {
  display: grid;
  grid-template-columns: auto 1.2fr 1fr;
  grid-template-areas: 'avatar video meta';
  align-items: center;
  gap: 0.85rem;
  height: 100%;
  padding: 0.7rem 0.85rem;
  box-sizing: border-box;
  font-family: var(--font);
}

.overlay[data-variant='orbit'] .skin__avatar {
  grid-area: avatar;
  width: 92px;
  height: 92px;
  border-radius: 999px;
  overflow: visible;
  position: relative;
  opacity: 0;
  transform: scale(0.62);
  transition: opacity 1.15s ease-in-out, transform 1.15s ease-in-out;
}

.overlay[data-variant='orbit'] .skin__avatar::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  border: 2px solid var(--clip-accent, #8b5cf6);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--clip-accent, #8b5cf6) 22%, transparent);
}

.overlay[data-variant='orbit'] .skin__avatar img {
  width: 92px;
  height: 92px;
  border-radius: 999px;
  object-fit: cover;
  display: block;
}

.overlay[data-variant='orbit'] .skin__video {
  grid-area: video;
  height: 100%;
  border-radius: 1rem;
  overflow: hidden;
}

.overlay[data-variant='orbit'] .skin video,
.overlay[data-variant='orbit'] .skin__meta {
  opacity: 0;
  transition: opacity 1.1s ease-in-out, transform 1.1s ease-in-out;
}

.overlay[data-variant='orbit'] .skin video {
  transform: scale(0.98);
}

.overlay[data-variant='orbit'] .skin__meta {
  grid-area: meta;
  color: #f5f7fb;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
  transform: translateX(12px);
}

.overlay[data-variant='orbit'] .skin__kicker {
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--clip-accent, #c4b5fd);
  margin-bottom: 0.25rem;
}

.overlay[data-variant='orbit'] .skin__name {
  font-size: 1.45rem;
  letter-spacing: -0.04em;
  line-height: 1.1;
  margin-bottom: 0.35rem;
}

.overlay[data-variant='orbit'] .skin__copy {
  color: rgba(255, 255, 255, 0.82);
  font-size: 0.88rem;
  line-height: 1.35;
}

.overlay[data-variant='orbit'] .skin__title {
  margin-top: 0.35rem;
  color: rgba(255, 255, 255, 0.48);
  font-size: 0.74rem;
  font-weight: 650;
}

.overlay[data-variant='orbit'].is-in .skin__avatar,
.overlay[data-variant='orbit'].is-in .skin video,
.overlay[data-variant='orbit'].is-in .skin__meta {
  opacity: 1;
  transform: none;
}

.overlay[data-variant='orbit'].is-in .skin video {
  transition-delay: 0.1s;
}

.overlay[data-variant='orbit'].is-in .skin__meta {
  transition-delay: 0.18s;
}

/* ——— Pill ——— */
.overlay[data-variant='pill'] .skin {
  position: relative;
  height: 100%;
  font-family: var(--font);
}

.overlay[data-variant='pill'] .skin__video {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 1rem;
}

.overlay[data-variant='pill'] .skin video {
  opacity: 0;
  transform: scale(1.04);
  transition: opacity 1.15s ease-in-out, transform 1.15s ease-in-out;
}

.overlay[data-variant='pill'] .skin__avatar {
  display: none;
}

.overlay[data-variant='pill'] .skin__meta {
  position: absolute;
  left: 14px;
  bottom: 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.2rem 0.65rem;
  max-width: 72%;
  padding: 0.55rem 0.9rem 0.55rem 0.7rem;
  border-radius: 999px;
  background: rgba(15, 17, 21, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #f5f7fb;
  opacity: 0;
  transform: translateX(-28px);
  transition: opacity 1.1s ease-in-out, transform 1.1s ease-in-out;
}

.overlay[data-variant='pill'] .skin__kicker {
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--clip-accent, #c4b5fd);
}

.overlay[data-variant='pill'] .skin__name {
  font-size: 0.98rem;
}

.overlay[data-variant='pill'] .skin__copy,
.overlay[data-variant='pill'] .skin__title {
  display: none;
}

.overlay[data-variant='pill'].is-in .skin video,
.overlay[data-variant='pill'].is-in .skin__meta {
  opacity: 1;
  transform: none;
}

.overlay[data-variant='pill'].is-in .skin__meta {
  transition-delay: 0.18s;
}

/* ——— HUD ——— */
.overlay[data-variant='hud'] .skin {
  position: relative;
  height: 100%;
  font-family: var(--font);
}

.overlay[data-variant='hud'] .skin__video {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 0.85rem;
}

.overlay[data-variant='hud'] .skin video {
  opacity: 0;
  transition: opacity 1.15s ease-in-out;
}

.overlay[data-variant='hud'] .skin__avatar {
  position: absolute;
  left: 12px;
  bottom: 12px;
  width: 40px;
  height: 40px;
  border-radius: 999px;
  overflow: hidden;
  z-index: 2;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 1s ease-in-out, transform 1s ease-in-out;
}

.overlay[data-variant='hud'] .skin__avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay[data-variant='hud'] .skin__meta {
  position: absolute;
  inset: 0;
  color: #fff;
  pointer-events: none;
}

.overlay[data-variant='hud'] .skin__kicker,
.overlay[data-variant='hud'] .skin__name,
.overlay[data-variant='hud'] .skin__title {
  position: absolute;
  margin: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out, transform 1s ease-in-out;
}

.overlay[data-variant='hud'] .skin__kicker {
  top: 12px;
  left: 12px;
  padding: 0.28rem 0.55rem;
  border-radius: 999px;
  background: rgba(15, 17, 21, 0.78);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transform: translateY(-10px);
}

.overlay[data-variant='hud'] .skin__name {
  left: 60px;
  bottom: 16px;
  font-size: 1rem;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
  transform: translateX(-12px);
}

.overlay[data-variant='hud'] .skin__title {
  right: 12px;
  bottom: 16px;
  max-width: 42%;
  text-align: right;
  font-size: 0.74rem;
  font-weight: 650;
  color: rgba(255, 255, 255, 0.78);
  transform: translateX(12px);
}

.overlay[data-variant='hud'] .skin__copy {
  display: none;
}

.overlay[data-variant='hud'].is-in .skin video,
.overlay[data-variant='hud'].is-in .skin__avatar,
.overlay[data-variant='hud'].is-in .skin__kicker,
.overlay[data-variant='hud'].is-in .skin__name,
.overlay[data-variant='hud'].is-in .skin__title {
  opacity: 1;
  transform: none;
}

.overlay[data-variant='hud'].is-in .skin__kicker {
  transition-delay: 0.08s;
}

.overlay[data-variant='hud'].is-in .skin__avatar,
.overlay[data-variant='hud'].is-in .skin__name {
  transition-delay: 0.16s;
}

.overlay[data-variant='hud'].is-in .skin__title {
  transition-delay: 0.24s;
}

/* ——— Slash ——— */
.overlay[data-variant='slash'] .skin {
  position: relative;
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
}

.overlay[data-variant='slash'] .skin__video {
  position: absolute;
  inset: 0;
  overflow: hidden;
  clip-path: polygon(0 0, 8% 0, 0 100%, 0 100%);
  transition: clip-path 1.2s ease-in-out;
}

.overlay[data-variant='slash'] .skin video {
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.overlay[data-variant='slash'] .skin__avatar {
  position: absolute;
  left: 64%;
  bottom: 14px;
  width: 64px;
  height: 64px;
  border-radius: 999px;
  overflow: hidden;
  z-index: 5;
  border: 2px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  transform: translate(-50%, 8px) scale(0.7);
  opacity: 0;
  transition: opacity 1.1s ease-in-out, transform 1.1s ease-in-out;
}

.overlay[data-variant='slash'] .skin__avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay[data-variant='slash'] .skin__meta {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 44%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 3;
  padding: 1rem 1.15rem 4.25rem 3.5rem;
  box-sizing: border-box;
  color: #fff;
  background: linear-gradient(
    105deg,
    transparent 0%,
    color-mix(in srgb, var(--clip-accent, #8b5cf6) 55%, #0f1115) 32%
  );
  opacity: 0;
  transform: translateX(28px);
  transition: opacity 1.15s ease-in-out, transform 1.15s ease-in-out;
}

.overlay[data-variant='slash'] .skin__kicker {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 0.3rem;
}

.overlay[data-variant='slash'] .skin__name {
  font-size: 1.45rem;
  letter-spacing: -0.04em;
  line-height: 1.05;
  margin-bottom: 0.35rem;
}

.overlay[data-variant='slash'] .skin__copy {
  font-size: 0.84rem;
  line-height: 1.35;
  color: rgba(255, 255, 255, 0.86);
}

.overlay[data-variant='slash'] .skin__title {
  display: none;
}

.overlay[data-variant='slash'].is-in .skin__video {
  clip-path: polygon(0 0, 78% 0, 62% 100%, 0 100%);
}

.overlay[data-variant='slash'].is-in .skin video,
.overlay[data-variant='slash'].is-in .skin__meta {
  opacity: 1;
}

.overlay[data-variant='slash'].is-in .skin__avatar {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

.overlay[data-variant='slash'].is-in .skin__meta {
  transform: none;
  transition-delay: 0.12s;
}

@media (prefers-reduced-motion: reduce) {
  .skin video,
  .skin__avatar,
  .skin__meta {
    transition: none !important;
  }
}

    </style>
</head>
<body>
    <div id="stage">
        <div id="overlay" class="overlay is-idle" data-variant="classic">
            <div class="skin">
                <div class="skin__video">
                    <video id="vplayer" playsinline></video>
                </div>
                <div class="skin__avatar">
                    <img id="avatar" alt="">
                </div>
                <div class="skin__meta" id="meta">
                    <p class="skin__kicker" id="kicker"></p>
                    <h2 class="skin__name" id="name"></h2>
                    <p class="skin__copy" id="copy"></p>
                    <p class="skin__title" id="title"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="tester" id="tester" style="display: none;">
        <button id="test-button">Test</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script>
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('vplayer');
        const avatar = document.getElementById('avatar');
        const meta = document.getElementById('meta');
        const kicker = document.getElementById('kicker');
        const nameEl = document.getElementById('name');
        const copyEl = document.getElementById('copy');
        const titleEl = document.getElementById('title');
        const BASE_WIDTH = 800;
        const BASE_HEIGHT = 225;
        const KNOWN = {
            '1': 'classic', classic: 'classic',
            third: 'third', tile: 'tile', cinema: 'cinema',
            orbit: 'orbit', pill: 'pill', hud: 'hud', slash: 'slash',
            '2': '2', '3': '3'
        };

        function applyResponsiveScale() {
            const scale = Math.min(window.innerWidth / BASE_WIDTH, window.innerHeight / BASE_HEIGHT);
            overlay.style.transform = 'scale(' + Math.max(scale, 0.25) + ')';
        }
        applyResponsiveScale();
        window.addEventListener('resize', applyResponsiveScale);

        const urlParams = new URLSearchParams(window.location.search);
        const rawDesign = urlParams.get('design') || '1';
        const timeout = Number(urlParams.get('timeout') || 30);
        const testing = urlParams.get('testing') || false;
        if (testing) document.getElementById('tester').style.display = 'block';

        let variant = KNOWN[rawDesign];
        if (!variant) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://api.domdimabot.com/clip-designs/' + rawDesign + '.css';
            document.head.appendChild(link);
            variant = 'classic';
        }
        overlay.dataset.variant = variant;

        const channelID = window.location.pathname.split('/')[2];
        const socket = io('/clip/' + channelID, { reconnection: true });
        setInterval(() => socket.emit('ping', { channelID }), 1000);
        socket.on('ping', data => console.log('ping', data));
        socket.on('start-clip', () => socket.emit('clip-ended', { channelID }));

        let hideTimer = null;
        let endTimer = null;
        let enterFrame = 0;

        function motionFor(v) {
            if (v === 'classic' || v === '2' || v === '3') return { enter: 1500, exit: 1500 };
            if (v === 'third' || v === 'slash') return { enter: 1200, exit: 1100 };
            return { enter: 1100, exit: 1000 };
        }

        function hexToRgb(hex) {
            if (!hex) return { r: 255, g: 255, b: 255 };
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 255, b: 255 };
        }

        function clearPlayTimers() {
            if (hideTimer) clearTimeout(hideTimer);
            if (endTimer) clearTimeout(endTimer);
            cancelAnimationFrame(enterFrame);
            hideTimer = null;
            endTimer = null;
            enterFrame = 0;
        }

        function applyClassicPanel(color) {
            const rgb = hexToRgb(color);
            if (rgb.r <= 40 && rgb.g <= 40 && rgb.b <= 40) {
                meta.style.backgroundColor = 'rgba(204, 204, 204, 0.7)';
                meta.style.backdropFilter = 'blur(10px)';
                meta.style.border = '3px solid #000';
                meta.style.color = '#fff';
                return;
            }
            meta.style.backgroundColor = 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.7)';
            meta.style.backdropFilter = 'blur(10px)';
            meta.style.color = '#000';
            meta.style.border = '3px solid rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 1)';
        }

        function resetChrome() {
            overlay.classList.remove('is-in');
            overlay.classList.add('is-idle');
            overlay.style.removeProperty('--clip-accent');
            meta.style.backgroundColor = '';
            meta.style.backdropFilter = '';
            meta.style.border = '';
            meta.style.color = '';
            avatar.removeAttribute('src');
            kicker.textContent = '';
            nameEl.textContent = '';
            copyEl.textContent = '';
            titleEl.textContent = '';
            video.pause();
            video.removeAttribute('src');
            video.srcObject = null;
            while (video.firstChild) video.removeChild(video.firstChild);
            video.load();
        }

        function finishClip(clipID) {
            clearPlayTimers();
            resetChrome();
            socket.emit('clip-ended', { channelID, clipID });
        }

        socket.on('play-clip', async data => {
            clearPlayTimers();
            overlay.classList.remove('is-in');
            overlay.classList.add('is-idle');

            let clipLink = testing
                ? 'http://localhost:3000/video/clip/' + channelID + '?t=' + Date.now()
                : 'https://api.domdimabot.com/video/clip/' + channelID + '?t=' + Date.now();

            try {
                const response = await fetch(clipLink, { method: 'HEAD' });
                if (!response.ok) {
                    socket.emit('clip-ended', { channelID, clipID: data.clipID });
                    return;
                }
            } catch (error) {
                console.error('Error checking video:', error);
                socket.emit('clip-ended', { channelID, clipID: data.clipID });
                return;
            }

            let duration = Number(data.duration);
            if (duration > timeout) duration = timeout;
            const { enter, exit } = motionFor(variant);

            overlay.style.setProperty('--clip-accent', data.streamerColor || '#8b5cf6');
            if (variant === 'classic') applyClassicPanel(data.streamerColor);
            else {
                meta.style.backgroundColor = '';
                meta.style.backdropFilter = '';
                meta.style.border = '';
                meta.style.color = '';
            }

            kicker.textContent = data.game || '';
            nameEl.textContent = data.streamer || '';
            copyEl.textContent = data.description || '';
            titleEl.textContent = data.title || '';
            if (data.profileImage) {
                avatar.src = data.profileImage;
                avatar.alt = data.streamer || '';
            }

            overlay.classList.remove('is-idle');
            video.src = clipLink;
            video.muted = false;
            video.playsInline = true;

            const onReady = () => {
                video.play().then(() => {
                    enterFrame = requestAnimationFrame(() => {
                        enterFrame = requestAnimationFrame(() => {
                            overlay.classList.add('is-in');
                            const hideAt = Math.max(enter + 400, duration * 1000 - 500);
                            hideTimer = setTimeout(() => overlay.classList.remove('is-in'), hideAt);
                            endTimer = setTimeout(() => finishClip(data.clipID), hideAt + exit + 80);
                        });
                    });
                }).catch(err => {
                    console.log(err);
                    socket.emit('clip-ended', { channelID, clipID: data.clipID });
                });
            };

            video.addEventListener('canplaythrough', onReady, { once: true });
            video.load();
        });

        document.getElementById('test-button').addEventListener('click', () => {
            const streamers = ['cdom201', 'unositopolar', 'elkenozvt', 'misumik', 'ariascarletvt', 'ozbellvt'];
            fetch('http://localhost:3000/clip/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    channelID,
                    streamer: streamers[Math.floor(Math.random() * streamers.length)]
                })
            }).then(res => res.json()).then(data => console.log(data));
        });
    </script>
</body>
</html>
