<div class="auth-shell denied-shell">
  <header class="auth-brand">
    <img src="/assets/brand/mark-on-dark.png" alt="" width="30" height="32" /><span>dima</span
    ><span class="auth-brand__tag">admin</span>
  </header>
  <section class="auth-card panel denied-card">
    <span class="eyebrow">Admin access required</span>
    <h1>This workspace<br />is private.</h1>
    <p class="auth-description">
      Your account doesn’t have access to Dima Admin. Contact an administrator if you need access.
    </p>
    <button class="button button--primary auth-button" (click)="logout()">Sign out</button
    ><button class="auth-home" (click)="goHome()">
      Go to Dima <span aria-hidden="true">↗</span>
    </button>
  </section>
</div>
