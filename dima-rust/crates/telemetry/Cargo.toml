[package]
name = "dima-telemetry"
description = "Logger, trace context, metrics and log export."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dima-text = { workspace = true }
dima-core = { workspace = true }
dima-http = { workspace = true }
dima-store = { workspace = true }
dima-web = { workspace = true }
http = { workspace = true }
# `getrusage(RUSAGE_SELF)`: the process's CPU time over all threads without `unsafe`.
nix = { workspace = true, features = ["resource"] }
redis = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
dima-core = { workspace = true, features = ["test-util"] }
dima-http = { workspace = true, features = ["test-util"] }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
