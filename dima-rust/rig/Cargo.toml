[package]
name = "dima-rig"
description = "Side-by-side rig: runs the reference and the Rust candidate on the same scenario and compares what each one did."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "dima-rig"
path = "src/main.rs"

# Test fixture: a tiny HTTP server with deliberate defect variants, launched by
# the self-test target (tests/selftest-rig). Not part of any image.
[[bin]]
name = "dima-rig-fixture"
path = "tests/fixture/server.rs"
test = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bson = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
# Signing test webhooks (Twitch EventSub, Polar) exactly as the reference verifies them.
dima-core = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
http-body-util = { workspace = true }
# The mock of the outside world is a plain HTTP/1.1 server (it must be able to drop a
# connection, stall, and stream chunks with delays).
hyper = { workspace = true }
hyper-util = { workspace = true }
mongodb = { workspace = true }
nix = { workspace = true }
redis = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
uuid = { workspace = true }
