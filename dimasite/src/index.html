  <!-- Structured data: lets search engines understand the product and can
       unlock rich results (e.g. price) in search listings. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "DomDimaBot",
    "url": "https://domdimabot.com/",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web",
    "inLanguage": ["en", "es"],
    "description": "Start with commands and TTS, then add stronger moderation and deeper analytics as your channel grows. Built for English and Spanish streams. Free, $6, or $15.",
    "offers": [
      { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      { "@type": "Offer", "price": "6", "priceCurrency": "USD" },
      { "@type": "Offer", "price": "15", "priceCurrency": "USD" }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the stored theme before first paint to avoid a flash of the wrong
    // theme. Mirrors ThemeService's default ('dark' unless 'light' is stored).
    try {
      var storedTheme = localStorage.getItem('theme');
      var dark = storedTheme !== 'light';
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
