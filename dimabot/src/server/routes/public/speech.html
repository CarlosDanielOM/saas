<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Overlay</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script>
        const channelID = window.location.pathname.split('/')[2];
        const socket = io(`/speech/${channelID}`, {
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });

        let currentAudio = null;
        let currentWatchdog = null;

        function finishSpeech(speechID, audio) {
            if (currentAudio !== audio || audio.dataset.finished === 'true') {
                return;
            }
            audio.dataset.finished = 'true';
            clearInterval(currentWatchdog);
            currentWatchdog = null;
            socket.emit('speech-ended', {
                channelID,
                speechID
            });

            audio.remove();
            currentAudio = null;
        }

        socket.on('speech', (payload) => {
            if (!payload || !payload.audioUrl || !payload.speechID) {
                return;
            }

            if (currentAudio) {
                clearInterval(currentWatchdog);
                currentWatchdog = null;
                currentAudio.pause();
                currentAudio.remove();
                currentAudio = null;
            }

            const audio = document.createElement('audio');
            audio.autoplay = true;
            audio.src = payload.audioUrl;
            audio.dataset.speechId = payload.speechID;

            audio.addEventListener('ended', () => {
                finishSpeech(payload.speechID, audio);
            }, { once: true });

            audio.addEventListener('error', () => {
                finishSpeech(payload.speechID, audio);
            }, { once: true });

            document.body.appendChild(audio);
            currentAudio = audio;

            // OBS can fetch an audio file but leave playback stalled without
            // firing ended or error. Release that item once media time stops
            // advancing, so later speech does not wait for the server fallback.
            let lastPosition = 0;
            let lastProgressAt = Date.now();
            currentWatchdog = setInterval(() => {
                if (currentAudio !== audio) return;
                if (audio.currentTime > lastPosition + 0.05) {
                    lastPosition = audio.currentTime;
                    lastProgressAt = Date.now();
                } else if (Date.now() - lastProgressAt >= 8000) {
                    finishSpeech(payload.speechID, audio);
                }
            }, 1000);

            audio.play().catch(() => {
                finishSpeech(payload.speechID, audio);
            });
        });
    </script>
</body>
</html>
