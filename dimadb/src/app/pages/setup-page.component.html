<section class="wrap">
  <div class="brand">
    <span class="mark">db</span>
    <strong>dimadb</strong>
  </div>
  <span class="chip">First run</span>
  <div>
    <h1>Create admin</h1>
    <p>This screen locks after the first user exists.</p>
  </div>
  <form (submit)="submit($event)">
    <label>
      Username
      <input name="username" autocomplete="username" required />
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="new-password" minlength="8" required />
    </label>
    <label>
      Confirm password
      <input name="confirm" type="password" autocomplete="new-password" minlength="8" required />
    </label>
    @if (errorMessage(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
    <button class="btn" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create and enter' }}
    </button>
    <a class="btn ghost" routerLink="/login">Back to login</a>
  </form>
</section>
