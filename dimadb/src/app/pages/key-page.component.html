<section class="stack">
  <div class="head">
    <a routerLink="/browse">← Browse</a>
    <h1 class="key">{{ key() }}</h1>
    <div class="chips">
      <span class="pill" [class]="type()">{{ type() }}</span>
      <span class="pill">ttl 12m</span>
      <span class="pill">db0</span>
    </div>
  </div>
  <article class="card">
    <pre class="pre">1</pre>
  </article>
  <div class="actions">
    <button class="btn" type="button">Save</button>
    <button class="btn ghost" type="button">Refresh TTL</button>
    <button class="btn danger" type="button">Delete</button>
  </div>
</section>
