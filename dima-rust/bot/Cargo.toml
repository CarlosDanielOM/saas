[package]
name = "dima-bot"
description = "The bot process: EventSub ingress on port 3333 and the chat pipeline. Wiring only."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "dima-bot"
path = "src/main.rs"

[dependencies]
# What the bot runs (ledger/upper-layers.md section 2.3): dima-chat and, through it, dima-actions,
# dima-moderation and dima-features. Never dima-realtime, dima-services, dima-routes,
# dima-site-agent, dima-recap or dima-event-handlers (api/tests/layers.rs).
dima-chat = { workspace = true }
# Wiring: the environment, the engine's stack contract, telemetry.
dima-core = { workspace = true }
dima-engine = { workspace = true }
dima-telemetry = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
nix = { workspace = true }
