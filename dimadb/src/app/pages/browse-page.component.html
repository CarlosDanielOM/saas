<section>
  <div class="head">
    <h1>Browse</h1>
    <p class="sub">SCAN only. Fake keys for layout review.</p>
    <input class="search" type="search" placeholder="match overlay:*" value="*" />
  </div>
  <div class="list">
    @for (item of keys; track item.name) {
      <a class="row" routerLink="/key" [queryParams]="{ k: item.name, t: item.type }">
        <div>
          <div class="key">{{ item.name }}</div>
          <div class="meta">ttl {{ item.ttl }} · {{ item.size }}</div>
        </div>
        <span class="pill" [class]="item.type">{{ item.type }}</span>
      </a>
    }
  </div>
</section>
