# Workspace root for the Rust migration (see MIGRATION.md).
#
# The `[package]` below is the pre-existing single crate. It keeps building and
# keeps its tests until its modules are moved into `crates/` (Phase 2), then it
# is removed. New code never depends on it and never goes into it.
[workspace]
resolver = "3"
members = [".", "crates/*", "rig", "services/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.99"

# Every dependency of the new crates is declared here, once. Crates opt in with
# `name = { workspace = true }`. TLS is rustls with ring only; no OpenSSL, no
# vendor SDK crates: outside services are called with the shared HTTP client.
[workspace.dependencies]
# Internal crates.
dima-text = { path = "crates/text" }
dima-core = { path = "crates/core" }
dima-store = { path = "crates/store" }
dima-telemetry = { path = "crates/telemetry" }
dima-http = { path = "crates/http" }
dima-email = { path = "crates/email" }
dima-web = { path = "crates/web" }
dima-socketio = { path = "crates/socketio" }
dima-model = { path = "crates/model" }
dima-commands = { path = "crates/commands" }
dima-engine = { path = "crates/engine" }
dima-twitch = { path = "crates/twitch" }
dima-events = { path = "crates/events" }
dima-billing = { path = "crates/billing" }
# Runtime.
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "process", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt", "io"] }
futures-util = "0.3.34"
bytes = "1.12.1"
# Data formats. `preserve_order`: JSON objects keep insertion order, like JavaScript.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "float_roundtrip", "preserve_order"] }
# Errors.
thiserror = "2.0.21"
anyhow = "1.0.104"
# Stores.
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
# The same bson 3 the driver uses (re-exported as `mongodb::bson`), named directly for its
# extended JSON support (`serde_json-1`), which dima-store needs for DBPointer and test fixtures.
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
# dima-model: the path of a field that failed to decode (taken only after a decode failed).
serde_path_to_error = "0.1.20"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "aio", "script", "connection-manager"] }
# HTTP, outbound and inbound.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls-native-roots"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "form", "multipart", "ws"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
http = "1.5.0"
http-body-util = "0.1.5"
# dima-web: the inbound server loop (HTTP/1.1 connections with upgrades and graceful
# shutdown) and request-body inflation (body-parser accepts gzip and deflate bodies).
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "service", "http1", "server"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# dima-web: listen like Node (dual-stack `::` with IPV6_V6ONLY off). Already built for tokio.
socket2 = "0.6.5"
# dima-socketio: the Engine.IO transport (polling, WebSocket, upgrade, heartbeat); Socket.IO itself
# is our own layer (ledger/socketio.md). No default features: no tracing, no Engine.IO v3.
engineioxide = { version = "0.17.7", default-features = false }
# dima-socketio tests: a raw WebSocket client for the adversarial tests (the version engineioxide uses).
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
url = "2.5.8"
percent-encoding = "2.3.2"
mime = "0.3.17"
# Crypto and encodings.
sha2 = "0.10.9"
sha1 = "0.10.6"
md-5 = "0.10.6"
hmac = "0.12.1"
aes = { version = "0.8.4", default-features = false }
ctr = { version = "0.9.2", default-features = false }
subtle = "2.6.1"
base64 = "0.22.1"
hex = "0.4.3"
getrandom = "0.4.3"
# dima-core: wipes key material and plaintext buffers with writes the compiler cannot remove.
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# dimadb-server: the console's stored formats (`scrypt:<salt>:<hash>` passwords with Node's
# scryptSync defaults, AES-256-GCM connection passwords), byte-compatible with node:crypto.
scrypt = { version = "0.11.0", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
# dimadb-server: `rediss://` connections (node-redis accepts them) need a TLS provider installed
# explicitly; ring, as everywhere else in the workspace.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
uuid = { version = "1.28.0", features = ["v4"] }
# Text.
regex = "1.13.1"
# dima-core: the dotenv line grammar needs anchored captures at chosen offsets (same engine as regex).
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }
# dima-commands: the complement of a Unicode property as explicit ranges (RE2 patterns).
regex-syntax = { version = "0.8.11", default-features = false, features = ["std", "unicode"] }
unicode-normalization = "0.1.26"
icu_collator = "2.3.0"
# Side-by-side rig (rig/): command line, process-group signals (it also uses bson's Extended JSON, declared with the stores).
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Byte-index slicing of strings panics off a character boundary (MIGRATION.md section 4).
string_slice = "deny"

# Smaller, faster development builds: the shared target directory is used by
# every worktree, and full debug info for dependencies costs tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "unwind"

[package]
name = "dima-rust"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Preserve the original complete foundation for manual/library consumers.
# Deployed MongoDB workers select only `--no-default-features --features mongo`.
default = ["mongo", "redis", "postgres", "http"]
mongo = ["dep:mongodb", "dep:garde", "dep:futures-util", "dep:serde", "dep:serde_json", "dep:sha2", "dep:dotenvy", "dep:tokio", "dep:rustls"]
redis = ["dep:redis", "dep:tokio", "dep:rustls"]
postgres = ["dep:sqlx", "dep:tokio"]
http = ["dep:axum", "dep:tokio", "dep:tower-http"]
# Outbound HTTPS is independent from the Axum server capability.
http-client = ["dep:reqwest", "dep:tokio"]
# The dashboard's localeCompare game ties need ICU, not codepoint ordering.
unicode-collation = ["dep:icu_collator"]
# Opt-in service foundations for TypeScript util ports. None is in `default`
# or in a deployed worker profile; enable each one only where it is used.
# email, posthog, s3, and otel also compile aws-lc-rs into rustls; see
# `utils::install_default_tls_provider`.
socketio = ["http", "dep:socketioxide", "dep:serde_json"]
email = ["dep:resend-rs", "dep:rustls", "dep:serde_json", "dep:tokio"]
posthog = ["dep:posthog-rs", "dep:rustls", "dep:serde_json", "dep:tokio"]
qdrant = ["dep:qdrant-client", "dep:tokio", "dep:serde", "dep:serde_json", "dep:regex", "dep:md-5"]
s3 = ["dep:aws-sdk-s3", "dep:rustls", "dep:tokio"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:rustls"]
jwt = ["dep:jsonwebtoken", "dep:base64", "dep:serde", "dep:serde_json"]
re2-compat = ["dep:regex"]
audio = ["dep:symphonia"]
# Consolidated helpers are independently selectable; the umbrella is convenient
# for future bot/API ports. None is enabled by default or by a worker profile.
bot-utils = ["command-utils", "keywords", "chat-events", "ai-usage", "eventsub", "domain-events"]
command-utils = ["dep:serde_json", "dep:tokio", "dep:uuid"]
keywords = ["dep:regex", "dep:serde", "dep:serde_json", "dep:tokio", "dep:unicode-normalization"]
chat-events = ["dep:serde_json"]
ai-usage = ["dep:serde", "dep:serde_json", "dep:uuid"]
eventsub = ["dep:serde", "dep:serde_json"]
domain-events = ["dep:serde", "dep:serde_json"]
# Explicitly constructed shared logger; no default or worker profile enables it.
logger = ["dep:serde", "dep:serde_json", "serde_json/float_roundtrip", "dep:tokio", "dep:futures-util", "dep:uuid"]
logger-redis = ["logger", "redis"]
logger-otel = ["logger", "otel"]
# Explicit cache protocol adapter; no default or deployed profile enables it.
plan-cache = ["redis"]
twitch-client = ["http-client", "dep:serde_json"]
polar-client = ["http-client", "dep:serde", "dep:serde_json"]
# Reusable policies and adapters for future callers; no deployed profile opts in.
chat-message = ["dep:serde", "dep:serde_json"]
timer-policy = ["dep:serde", "dep:serde_json"]
# JS JSON numbers require correctly rounded binary64 input, including extremes.
credit-policy = ["dep:serde", "dep:serde_json", "serde_json/float_roundtrip"]
# Pure permission policies; intentionally outside bot-utils and worker profiles.
permissions = ["dep:serde", "dep:serde_json", "serde_json/float_roundtrip"]
cron-queue = ["redis", "dep:serde", "dep:serde_json", "dep:uuid"]
credential-crypto = ["dep:aes", "dep:ctr", "dep:getrandom", "dep:serde"]
twitch-tokens = ["twitch-client", "credential-crypto", "mongo", "redis"]
# Account directory composes existing opt-in protocols without changing workers.
twitch-streamers = ["twitch-tokens", "plan-cache", "logger"]
twitch-streamers-posthog = ["twitch-streamers", "posthog"]
# Standalone process supervision and telemetry; never widens worker profiles.
cron-supervisor = ["dep:redis", "dep:serde", "dep:serde_json", "dep:tokio", "dep:uuid", "dep:libc", "dep:dotenvy", "tokio/process", "tokio/fs", "tokio/io-util"]

[[bin]]
name = "cron_index"
path = "src/bin/cron_index.rs"
required-features = ["cron-supervisor"]

[[bin]]
name = "stream_activity"
path = "src/bin/stream_activity.rs"
required-features = ["mongo"]

[[bin]]
name = "raid_analytics"
path = "src/bin/raid_analytics.rs"
required-features = ["mongo"]

[[bin]]
name = "follow_defense_baseline"
path = "src/bin/follow_defense_baseline.rs"
required-features = ["mongo", "redis"]

[[bin]]
name = "roulette_completion"
path = "src/bin/roulette_completion.rs"
required-features = ["mongo"]

[[bin]]
name = "ai_usage_receipts"
path = "src/bin/ai_usage_receipts.rs"
required-features = ["mongo", "redis"]

[[bin]]
name = "raid_sessions"
path = "src/bin/raid_sessions.rs"
required-features = ["mongo", "redis"]

[[example]]
name = "stream_activity_fixture"
path = "examples/stream_activity_fixture.rs"
required-features = ["mongo"]

[[bin]]
name = "dashboard_activity"
path = "src/bin/dashboard_activity.rs"
required-features = ["mongo", "redis", "http-client", "unicode-collation"]

[dependencies]
aes = { version = "=0.8.4", optional = true, default-features = false }
ctr = { version = "=0.9.2", optional = true, default-features = false }
getrandom = { version = "=0.4.3", optional = true }
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
dotenvy = { version = "0.15.7", optional = true }
garde = { version = "0.23.0", optional = true, features = ["derive"] }
futures-util = { version = "0.3.34", optional = true }
icu_collator = { version = "2.3.0", optional = true }
libc = { version = "=0.2.191", optional = true }
# compat-3-3-0 keeps BSON 3 only; compat-3-0-0 would also pull BSON 2.
mongodb = { version = "3.9.1", optional = true, default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
redis = { version = "1.7.1", optional = true, default-features = false, features = ["tokio-rustls-comp", "script", "connection-manager"] }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["json", "rustls-tls-native-roots"] }
# MongoDB selects ring itself. Redis TLS needs an explicit provider when built
# alone; it must not depend on MongoDB or SQLx feature unification for one.
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.154", optional = true, features = ["raw_value"] }
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "1.54.0", optional = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
# Service foundations below are optional and outside every worker profile.
# Each disables crate defaults so TLS stays on rustls (no OpenSSL on musl).
# Same base64 jsonwebtoken already uses, for Node-identical JWT segments.
base64 = { version = "0.22.1", optional = true }
aws-sdk-s3 = { version = "1.154.0", optional = true, default-features = false, features = ["rt-tokio", "default-https-client", "http-1x", "sigv4a"] }
jsonwebtoken = { version = "11.1.0", optional = true, default-features = false, features = ["rust_crypto"] }
opentelemetry = { version = "0.33.1", optional = true, default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.33.1", optional = true, default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.33.1", optional = true, default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client", "reqwest-rustls"] }
posthog-rs = { version = "0.27.0", optional = true, default-features = false, features = ["async-client"] }
# Match the production server minor (qdrant v1.17.0); Qdrant supports one minor of skew.
qdrant-client = { version = "~1.17.0", optional = true, default-features = false, features = ["serde"] }
md-5 = { version = "0.11.0", optional = true }
regex = { version = "1.13.1", optional = true }
resend-rs = { version = "0.35.0", optional = true, default-features = false, features = ["rustls-tls"] }
socketioxide = { version = "0.18.7", optional = true }
symphonia = { version = "0.6.1", optional = true, default-features = false, features = ["mp3", "id3v2"] }
tower-http = { version = "0.7.1", optional = true, features = ["cors"] }
unicode-normalization = { version = "=0.1.26", optional = true }
uuid = { version = "=1.28.0", optional = true, features = ["v4"] }
