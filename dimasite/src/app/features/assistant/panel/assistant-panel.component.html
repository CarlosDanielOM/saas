@if (presence.enabled()) {
  <!-- Outside the panel so it still announces while the panel is closed. -->
  <p class="sr-only" aria-live="polite" data-assistant-announcer>{{ store.announcement() }}</p>
}

@if (rendered() && presence.enabled()) {
  @if (isOpen() && !desktop() && !peek()) {
    <div class="ap-backdrop" aria-hidden="true" (click)="close()"></div>
  }
  <section
    #panel
    id="assistant-panel"
    class="ap"
    data-assistant-panel
    role="dialog"
    aria-modal="false"
    aria-labelledby="assistant-panel-title"
    [hidden]="!isOpen()"
    [attr.inert]="isOpen() ? null : ''"
    [class.ap--peek]="peek()"
    [class.ap--dragging]="dragging()"
    [style.transform]="transform()"
    [style.--ap-top.px]="navBottom()"
    (keydown.escape)="onEscape($event)"
  >
    <button
      type="button"
      class="ap-handle"
      [attr.aria-label]="peek() ? t('assistant.sheet.expand') : t('assistant.sheet.shrink')"
      [attr.aria-expanded]="!peek()"
      (pointerdown)="onHandleDown($event)"
      (pointermove)="onHandleMove($event)"
      (pointerup)="onHandleUp($event)"
      (pointercancel)="onHandleUp($event)"
      (click)="onHandleClick()"
    >
      <span class="ap-handle__bar" aria-hidden="true"></span>
    </button>

    @if (peek()) {
      <div class="ap-peek" data-assistant-peek>
        <button type="button" class="ap-peek__open" (click)="expand()">
          <span class="ap-peek__dot" [class.ap-peek__dot--on]="store.running()" aria-hidden="true"></span>
          <span class="ap-peek__text">
            <span class="ap-peek__title" id="assistant-panel-title">{{ t('assistant.title') }}</span>
            <span class="ap-peek__status">{{ peekText() }}</span>
          </span>
          <span class="ap-peek__cta">{{ t('assistant.sheet.open') }}</span>
        </button>
        <button type="button" class="ap-icon" [attr.aria-label]="t('assistant.close')" (click)="close()">
          <app-lf-icon name="close" [size]="17" />
        </button>
      </div>
    } @else {
      <header class="ap-head">
        <div class="ap-head__text">
          <h2 class="ap-title" id="assistant-panel-title" tabindex="-1">{{ t('assistant.title') }}</h2>
          <p class="ap-sub">{{ subtitle() }}</p>
        </div>
        <button type="button" class="ap-icon" [attr.aria-label]="t('assistant.sessions.new')" [title]="t('assistant.sessions.new')" (appThrottleClick)="newChat()" data-assistant-new>
          <app-lf-icon name="plus" [size]="18" />
        </button>
        <button
          type="button"
          class="ap-icon"
          [class.ap-icon--on]="listOpen()"
          [attr.aria-label]="t('assistant.sessions.title')"
          [title]="t('assistant.sessions.title')"
          [attr.aria-expanded]="listOpen()"
          aria-controls="assistant-chats"
          (click)="toggleList()"
          data-assistant-chats-btn
        >
          <app-lf-icon name="list" [size]="18" />
        </button>
        <button type="button" class="ap-icon" [attr.aria-label]="t('assistant.close')" [title]="t('assistant.close')" (click)="close()" data-assistant-close>
          <app-lf-icon name="close" [size]="18" />
        </button>
      </header>

      <div class="ap-tabs" role="tablist" [attr.aria-label]="t('assistant.tabs.label')" (keydown)="onTabKey($event)">
        <button
          type="button"
          role="tab"
          id="assistant-tab-chat"
          class="ap-tab"
          [attr.aria-selected]="tab() === 'chat'"
          [attr.tabindex]="tab() === 'chat' ? 0 : -1"
          aria-controls="assistant-tabpanel-chat"
          (click)="setTab('chat')"
        >
          {{ t('assistant.tabs.chat') }}
        </button>
        <button
          type="button"
          role="tab"
          id="assistant-tab-changes"
          class="ap-tab"
          [attr.aria-selected]="tab() === 'changes'"
          [attr.tabindex]="tab() === 'changes' ? 0 : -1"
          aria-controls="assistant-tabpanel-changes"
          (click)="setTab('changes')"
          data-assistant-changes-tab
        >
          {{ t('assistant.tabs.changes') }}
        </button>
      </div>
    }

    <div class="ap-body">
      <div
        class="ap-tabpanel"
        id="assistant-tabpanel-chat"
        role="tabpanel"
        aria-labelledby="assistant-tab-chat"
        [hidden]="tab() !== 'chat'"
      >
        <app-assistant-thread (openChanges)="showChanges()" (example)="sendExample($event)" />
        <app-assistant-composer />
      </div>
      @if (tab() === 'changes') {
        <div class="ap-tabpanel" id="assistant-tabpanel-changes" role="tabpanel" aria-labelledby="assistant-tab-changes">
          <app-assistant-changes />
        </div>
      }
      @if (listOpen()) {
        <app-assistant-sessions id="assistant-chats" role="region" aria-labelledby="assistant-chats-title" (closed)="closeList()" (picked)="pickedFromList()" />
      }
    </div>
  </section>
}
