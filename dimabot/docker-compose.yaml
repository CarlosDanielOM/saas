services:
  # =========================================
  # SERVICE 1: API SERVER (Dashboard Backend)
  # =========================================
  api-server:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - SERVICE_NAME=server
        - NODE_ENV=production
    image: dimabot/api-server:latest
    container_name: dima-server
    command: node dist/server/index.js
    restart: always
    env_file: .env
    environment:
      PIPER_HTTP_URL: http://piper-tts:5000
      PUBLIC_API_URL: https://api.domdimabot.com
    networks:
      - web-proxy
      - databases

  # =========================================
  # SERVICE 2: CHAT BOT (Twitch Connection)
  # =========================================
  chat-bot:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - SERVICE_NAME=bot
        - NODE_ENV=production
    image: dimabot/chat-bot:latest
    container_name: dima-bot
    command: node dist/bot/index.js
    restart: always
    env_file: .env
    environment:
      INTERNAL_API_URL: http://dima-server:3000
      PUBLIC_API_URL: https://api.domdimabot.com
    networks:
      - web-proxy
      - databases

  # =========================================
  # SERVICE 3: CRON WORKERS (Host Process)
  # =========================================
  dima-cron:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - SERVICE_NAME=cron
        - NODE_ENV=production
    container_name: dima-cron
    command: node dist/workers/cron.index.js
    restart: always
    env_file: .env
    stop_grace_period: 30s
    networks:
      - web-proxy
      - databases

  # =========================================
  # SERVICE 4: PIPER HTTP TTS
  # =========================================
  piper-tts:
    build:
      context: .
      dockerfile: dockerfile.piper
    container_name: piper-tts
    restart: always
    networks:
      - databases
    volumes:
      - piper-data:/voices

  # =========================================
  # SERVICE 5: LFM2.5 EMBEDDINGS (Self-Hosted GGUF)
  # =========================================
  # OpenAI-compatible embedding server backed by Liquid AI's
  # LFM2.5-Embedding-350M-GGUF (Q8_0), served via sentence-transformers
  # + FastAPI. Replaces the paid OpenRouter embedding endpoint.
  #
  # Note: the upstream llama.cpp b9744 image does not yet support the
  # lfm2-bidir architecture that this GGUF uses, so we serve via
  # sentence-transformers (the model card's primary recommended path).
  # Only reachable from the databases network.
  # =========================================
  lfm2.5-embeddings:
    build:
      context: .
      dockerfile: dockerfile.lfm2-embeddings
    image: dimabot/lfm2-embeddings:latest
    container_name: lfm2.5-embeddings
    restart: always
    networks:
      - databases
    volumes:
      - lfm2-embeddings-data:/data
    # CPU-only. The Q8_0 model is ~380MB. 3GB gives headroom for the
    # Python runtime + sentence-transformers caches.
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '6'
        reservations:
          memory: 1G
    # Healthcheck hits the FastAPI /health endpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web-proxy:
    external: true
  databases:
    external: true

volumes:
  piper-data:
  lfm2-embeddings-data:
