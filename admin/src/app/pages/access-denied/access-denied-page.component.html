<section class="access-denied-shell bg-gray-950 min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Background decorations -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 -left-20 w-72 h-72 bg-red-600/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-orange-600/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 w-full max-w-md px-6 text-center">
    <!-- Icon -->
    <div class="mb-8 animate-fade-in-up">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-red-500/10 border border-red-500/20">
        <svg class="w-12 h-12 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
    </div>

    <!-- Content -->
    <div class="animate-fade-in-up stagger-1">
      <h1 class="text-4xl font-bold text-white mb-4">Access Denied</h1>
      <p class="text-gray-400 mb-2">You are not authorized to access this panel.</p>
      <p class="text-gray-500 text-sm mb-10">If you believe this is an error, please contact the administrator.</p>
    </div>

    <!-- Actions -->
    <div class="space-y-4 animate-fade-in-up stagger-2">
      <button
        type="button"
        class="w-full py-3 px-6 rounded-xl bg-gray-800 hover:bg-gray-700 text-white font-medium transition-all duration-300 flex items-center justify-center gap-2 border border-gray-700 hover:border-gray-600"
        (click)="logout()"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Sign Out
      </button>

      <button
        type="button"
        class="w-full py-3 px-6 rounded-xl text-gray-400 hover:text-white font-medium transition-all duration-300"
        (click)="goHome()"
      >
        Go to Homepage
      </button>
    </div>
  </div>
</section>
