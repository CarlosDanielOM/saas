<div class="shell">
  <aside class="rail" aria-label="Primary">
    <div class="brand">
      <span class="mark">db</span>
      <div>
        <strong>dimadb</strong>
        <small>console</small>
      </div>
    </div>
    <nav class="rail-nav">
      @for (item of nav; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="is-active">
          <span class="ico" aria-hidden="true" [attr.data-icon]="item.icon"></span>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="stage">
    <header class="top">
      <span class="chip">Live</span>
      <label class="conn">
        <span class="sr-only">Connection</span>
        <select [value]="connections.selectedId() || ''" (change)="onSelect($event)">
          @for (item of connections.items(); track item.id) {
            <option [value]="item.id">{{ item.name }} · {{ item.engine }}</option>
          }
          @if (connections.items().length === 0) {
            <option value="">No connections</option>
          }
        </select>
      </label>
    </header>
    <main class="main">
      <router-outlet />
    </main>
  </div>

  <nav class="dock" aria-label="Primary">
    @for (item of nav; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="is-active">
        <span class="ico" aria-hidden="true" [attr.data-icon]="item.icon"></span>
        {{ item.label }}
      </a>
    }
  </nav>
</div>
