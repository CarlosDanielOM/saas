services:
  analytics:
    image: dima-analytics:latest
    container_name: dima-analytics
    restart: unless-stopped
    command: node src/index.mjs
    env_file: .env
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [databases]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3210/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  databases:
    external: true
